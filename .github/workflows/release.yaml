name: Release

on:
  push:
    # Multi-module repo: the root, x/config and x/comparators release
    # in LOCKSTEP. Tagging vX.Y.Z alone leaves the extension modules
    # unpublishable - Go resolves each submodule's version only from its
    # own x/<name>/vX.Y.Z tag.
    tags: ["v*", "x/config/v*", "x/comparators/v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish Go module release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate semantic version tag
        shell: bash
        run: >-
          [[ "${GITHUB_REF_NAME##*/}" =~
          ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
      - name: Require an annotated tag signed by the release key
        # Every tag must be annotated (fetch-depth: 0 already brought every
        # ref; no network here). Tags after v0.1.1 must additionally carry
        # a good signature from the maintainer release key committed at
        # .github/release-signing-key.asc; v0.1.0 and v0.1.1 predate the
        # key and are grandfathered (annotated, unsigned, immutable).
        shell: bash
        run: |
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == "tag" ]]
          case "${GITHUB_REF_NAME##*/}" in
          v0.1.0|v0.1.1) echo "grandfathered pre-signing tag" ;;
          *)
            gpg --import .github/release-signing-key.asc
            fpr="$(gpg --with-colons --import-options show-only --import .github/release-signing-key.asc | awk -F: '/^fpr/{print $10; exit}')"
            git verify-tag --raw "$GITHUB_REF_NAME" 2>&1 | grep -q "VALIDSIG $fpr" || {
              echo "tag $GITHUB_REF_NAME is not signed by the approved release key $fpr"; exit 1; }
            ;;
          esac
      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify lockstep tags on this commit
        # Lockstep, enforced not just documented: the SAME version must be tagged
        # for the root and BOTH extension modules, all pointing at the SAME
        # commit. An incomplete tag set must fail loudly here, not publish
        # a partial release that claims lockstep.
        shell: bash
        run: |
          version="${GITHUB_REF_NAME##*/}"
          for t in "$version" "x/config/$version" "x/comparators/$version"; do
            sha="$(git rev-list -n1 "refs/tags/$t" 2>/dev/null)" || { echo "missing lockstep tag: $t"; exit 1; }
            [[ "$sha" == "$GITHUB_SHA" ]] || { echo "tag $t points at $sha, not $GITHUB_SHA"; exit 1; }
          done
      - name: Require green CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag build alone is not enough: the full multi-platform CI and
        # security workflows for this exact commit must have succeeded, so a
        # release can never publish a commit whose branch checks are red.
        run: |
          for wf in ci.yaml codeql.yaml; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf"               --commit "$GITHUB_SHA" --json conclusion --jq 'map(select(.conclusion=="success")) | length')"
            [ "$conclusion" -ge 1 ] || { echo "workflow $wf has no successful run for $GITHUB_SHA"; exit 1; }
          done
      - name: Verify release
        run: make ci
      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        # One GitHub release per ROOT tag; the x/ tags publish the extension
        # modules to the Go module proxy but need no separate release page.
        if: ${{ !startsWith(github.ref_name, 'x/') }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
