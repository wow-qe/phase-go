name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -shuffle=on -timeout=120s ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 -shuffle=on -timeout=120s ./...
      - name: Test submodules
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for m in x/config x/comparators examples/checkout examples/misuse; do
            (cd "$m" && go test -race -count=1 -shuffle=on -timeout=120s ./...) || exit 1
          done
      - name: Test submodules
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for m in x/config x/comparators examples/checkout examples/misuse; do
            (cd "$m" && go test -count=1 -shuffle=on -timeout=120s ./...) || exit 1
          done

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check module tidiness (all modules)
        run: make mod-tidy-check
      - name: Check formatting
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Comment standard
        run: go run ./cmd/commentcheck
      - name: No tracked binaries
        run: make binary-check
      - name: Exported API matches baseline
        run: make api-check
      - name: Package boundaries hold
        run: make boundary-check
      - name: Release rehearsal (local proxy, all consumer shapes)
        shell: bash
        run: |
          v="$(awk '/github.com\/wow-qe\/phase-go v/{print $2; exit}' x/config/go.mod)"
          proxy="$(mktemp -d)"
          bash scripts/build-local-proxy.sh "$v" "$proxy"
          export GOPROXY="file://$proxy,https://proxy.golang.org" GONOSUMDB='github.com/wow-qe/*' GOPRIVATE='github.com/wow-qe/*' GOFLAGS=-mod=mod
          for mode in root config comparators all; do
            sh scripts/consumer-smoke.sh "$mode" "$v" || exit 1
          done
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
      - name: Test with coverage
        run: go test -count=1 -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify proposed commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan repository
        run: gitleaks git --redact --no-banner
